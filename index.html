<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="An interactive morning on Waikīkī Beach.">
  <meta name="theme-color" content="#12375a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e6af38'/%3E%3Cpath d='M2 16a14 14 0 0 1 28 0Z' fill='%23eb5739'/%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%2312375a' stroke-width='2'/%3E%3C/svg%3E">
  <title>Waikīkī Surf Club</title>
  <script type="module" crossorigin src="/waikiki/assets/index-7mk9Bkfo.js"></script>
  <link rel="stylesheet" crossorigin href="/waikiki/assets/index-DDcQWlDK.css">
</head>
<body>
  <main id="experience" aria-label="Interactive Waikīkī beach">
    <div id="view"></div>
    <header class="masthead">
      <h1 class="brand"><span class="sun" aria-hidden="true"></span><span>Waikīkī<br><b>Surf Club</b></span></h1>
      <button id="sound" aria-pressed="false" disabled>Beach sound</button>
    </header>
    <aside class="guide" aria-label="Camera views" inert>
      <div class="guide-header">
        <h2 id="mode" aria-live="polite">Beach Overview</h2>
        <span id="bearing" aria-label="Camera heading" hidden></span>
      </div>
      <div class="viewpoint-picker">
        <label class="visually-hidden" for="viewpoint">Scenic viewpoint</label>
        <select id="viewpoint">
          <option value="" disabled>Choose a viewpoint</option>
          <option value="overview" selected>Beach Overview</option>
          <option value="walk">Beach Walk</option>
        </select>
        <button id="explore" aria-controls="shortcuts" aria-expanded="false">Explore</button>
      </div>
      <nav id="shortcuts" aria-label="People and places">
        <div role="group" aria-label="Follow a person">
          <button data-follow="carrier">Board carrier</button>
          <button data-follow="customer">Shave ice customer</button>
          <button data-follow="surfer">Surfer</button>
        </div>
        <div role="group" aria-label="Visit a shop">
          <button id="snack-view" aria-haspopup="dialog">Hot Dogs &amp; Snacks</button>
          <button id="fruit-view" aria-haspopup="dialog">Tropical Fruit</button>
          <button id="shop-view">Inside the Shop</button>
        </div>
      </nav>
      <p id="fruit-receipt" role="status" hidden></p>
      <p id="snack-receipt" role="status" hidden></p>
      <div class="camera-tools">
        <p id="hint">Drag to look around. Scroll to zoom.</p>
        <button id="walk" type="button">Walk around</button>
        <div id="zoom" role="group" aria-label="Camera zoom">
          <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
          <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
        </div>
      </div>
      <button id="back" hidden>Back to Overview <kbd>Esc</kbd></button>
    </aside>
    <dialog id="snack-menu" aria-labelledby="snack-title">
      <header>
        <h2 id="snack-title">Hot Dogs &amp; Snacks</h2>
        <form method="dialog"><button autofocus>Close</button></form>
      </header>
      <ul id="snack-items" aria-label="Menu"></ul>
      <footer>
        <p id="snack-total" role="status"></p>
        <button id="snack-order" disabled>Place simulated order</button>
      </footer>
    </dialog>
    <dialog id="fruit-menu" aria-labelledby="fruit-title">
      <header>
        <h2 id="fruit-title">Tropical Fruit</h2>
        <form method="dialog"><button autofocus>Close</button></form>
      </header>
      <ul id="fruit-items" aria-label="Fruit menu"></ul>
      <footer>
        <p id="fruit-total" role="status"></p>
        <button id="fruit-display" type="button" disabled>Display on counter</button>
        <button id="fruit-order" disabled>Place simulated order</button>
      </footer>
    </dialog>
    <div id="dive-pad" class="movement-pad" role="group" aria-label="Swimming controls" hidden>
      <button data-swim="KeyW" aria-label="Swim forward"><span class="swim-arrow" aria-hidden="true"></span></button>
      <button data-swim="KeyA" aria-label="Swim left"><span class="swim-arrow" aria-hidden="true"></span></button>
      <button data-swim="KeyS" aria-label="Swim backward"><span class="swim-arrow" aria-hidden="true"></span></button>
      <button data-swim="KeyD" aria-label="Swim right"><span class="swim-arrow" aria-hidden="true"></span></button>
      <button data-swim="KeyQ">Dive</button>
      <button data-swim="KeyE">Rise</button>
    </div>
    <div id="walk-pad" class="movement-pad" role="group" aria-label="Walking controls" hidden>
      <button type="button" data-walk="KeyW" aria-label="Walk forward"><span class="swim-arrow" aria-hidden="true"></span></button>
      <button type="button" data-walk="KeyA" aria-label="Walk left"><span class="swim-arrow" aria-hidden="true"></span></button>
      <button type="button" data-walk="KeyS" aria-label="Walk backward"><span class="swim-arrow" aria-hidden="true"></span></button>
      <button type="button" data-walk="KeyD" aria-label="Walk right"><span class="swim-arrow" aria-hidden="true"></span></button>
      <button type="button" data-walk="KeyQ">Descend</button>
      <button type="button" data-walk="KeyE">Rise</button>
    </div>
    <div id="markers" aria-hidden="true"></div>
    <p id="loading" class="scene-message" role="status">Loading Waikīkī Beach…</p>
    <div id="error" class="scene-message" hidden>
      <p id="error-message" role="alert"></p>
      <button id="retry" type="button">Reload scene</button>
    </div>
    <noscript><style>#loading{display:none}</style><p class="scene-message">Enable JavaScript to explore the beach.</p></noscript>
  </main>
</body>
</html>
